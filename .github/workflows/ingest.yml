# Napi árfolyam-letöltés és feature-számítás a privát tárba (spec/05, 5. fejezet).
# A futás naplója nyilvános: csak darabszám és forrásnév kerül bele, ár soha.
name: Ingest

on:
  schedule:
    # Hétköznap 22:30 UTC: a NYSE zárása (20:00 / 21:00 UTC) után bőven.
    # A GitHub ütemezése terhelésnél késhet (spec/05, 9. fejezet, 5. sor).
    - cron: "30 22 * * 1-5"
    # Vasárnap teljes újratöltés: a forrás visszamenőleges igazításai ellen.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = utolsó 10 session, backfill = teljes múlt 2005-től"
        type: choice
        options: [daily, backfill]
        default: daily

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --frozen --no-dev
      - name: Letöltés
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MODE: ${{ inputs.mode || (github.event.schedule == '0 6 * * 0' && 'backfill') || 'daily' }}
        run: uv run python -m pipeline.ingest.run --mode "$MODE"
      - name: Feature-ök és rezsim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MODE: ${{ inputs.mode || (github.event.schedule == '0 6 * * 0' && 'backfill') || 'daily' }}
        run: uv run python -m pipeline.features.run --mode "$MODE"
