# Heti modelltanítás és (kézzel indítva) a teljes purged walk-forward backtest.
# A napló nyilvános: csak darabszám és metaadat kerül bele, mért érték nem.
name: Train

on:
  schedule:
    # Vasárnap 08:00 UTC: a 06:00-s teljes újratöltés és feature-futás után.
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      task:
        description: "train = heti tanítás, challengers = csak a modell-aréna kihívói, arena-backtest = a négy család backtestje, backtest = teljes walk-forward mérés, report = a tárolt mérés kiírása, crypto-train / crypto-backtest = a kripto-modell (docs/kripto-modell.md), fx-train / fx-backtest = a deviza-modell (docs/fx-modell.md), bonds-train / bonds-backtest = a kötvény-modell (docs/kotveny.md)"
        type: choice
        options: [train, challengers, backtest, arena-backtest, report, crypto-train, crypto-backtest, fx-train, fx-backtest, bonds-train, bonds-backtest]
        default: train

permissions:
  contents: read

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --frozen --no-dev
      - name: Tanítás vagy backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TASK: ${{ inputs.task || 'train' }}
        # A részletes kimenet (papíronkénti sorok) a privát tárba megy; a
        # naplóba csak az összesített, modellszintű összefoglaló kerül.
        run: |
          case "$TASK" in
            crypto-*) uv run python -m pipeline.crypto.model --task "${TASK#crypto-}" | tee /tmp/result.json ;;
            fx-*) uv run python -m pipeline.fx.model --task "${TASK#fx-}" | tee /tmp/result.json ;;
            bonds-*) uv run python -m pipeline.bonds.model --task "${TASK#bonds-}" | tee /tmp/result.json ;;
            *) uv run python -m pipeline.model.run --task "$TASK" | tee /tmp/result.json ;;
          esac
          echo "kesz: $TASK"
      - name: A kripto-, a deviza- és a kötvény-modell heti tanítása
        # Az ütemezett heti futásban a részvényes tanítás után; ha elbukik, a
        # részvényes modell mentése ettől már megtörtént.
        if: ${{ github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          uv run python -m pipeline.crypto.model --task train
          uv run python -m pipeline.fx.model --task train
          uv run python -m pipeline.bonds.model --task train
