# Heti modelltanítás és (kézzel indítva) a teljes purged walk-forward backtest.
# A napló nyilvános: csak darabszám és metaadat kerül bele, mért érték nem.
name: Train

on:
  schedule:
    # Vasárnap 08:00 UTC: a 06:00-s teljes újratöltés és feature-futás után.
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      task:
        description: "train = heti tanítás, backtest = teljes walk-forward mérés, report = a tárolt mérés kiírása"
        type: choice
        options: [train, backtest, report]
        default: train

permissions:
  contents: read

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --no-dev
      - name: Tanítás vagy backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TASK: ${{ inputs.task || 'train' }}
        # A részletes kimenet (papíronkénti sorok) a privát tárba megy; a
        # naplóba csak az összesített, modellszintű összefoglaló kerül.
        run: |
          uv run python -m pipeline.model.run --task "$TASK" | tee /tmp/result.json
          echo "kesz: $TASK"
