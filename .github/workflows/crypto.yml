# A kripto napi letöltése (docs/kripto-univerzum.md; 5. fázis, E1).
# A kripto napja UTC-éjfélkor zárul; a futás utána, külön ütemezéssel, hogy a
# részvényes napi futást (22:30 UTC) ne érintse. A napló nyilvános: csak
# darabszám és forrásnév kerül bele, ár soha.
name: Crypto

on:
  schedule:
    # Háromszor a 6 órás ablakon belül (docs/kripto-modell.md, 6.): a GitHub
    # ütemezője órákat késhet, és a forrás is késve teheti közzé a napot. A
    # becslés egyszer mentődik; a későbbi futás nem írja felül.
    - cron: "30 0 * * *"
    - cron: "30 2 * * *"
    - cron: "30 4 * * *"
    # Vasárnap teljes újratöltés, mint a részvényeknél.
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = utolsó 10 nap, backfill = teljes múlt 2014-től"
        type: choice
        options: [daily, backfill]
        default: daily

permissions:
  # A napi kripto-lenyomat (hash) commitolásához írás kell a repóba.
  contents: write

concurrency:
  group: crypto
  cancel-in-progress: false

jobs:
  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --no-dev
      - name: Letöltés
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MODE: ${{ inputs.mode || (github.event.schedule == '0 7 * * 0' && 'backfill') || 'daily' }}
        run: uv run python -m pipeline.ingest.crypto --mode "$MODE"
      - name: Napi kripto-becslés (a megjelenítés előtt mentve)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m pipeline.crypto.forecast --manifest-dir manifests-crypto
      - name: A napi kripto-lenyomat commitolása
        # Csak a hash és a darabszámok kerülnek a publikus repóba (commit–reveal).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p manifests-crypto
          git add manifests-crypto
          if git diff --cached --quiet; then
            echo "nincs uj lenyomat"
            exit 0
          fi
          git commit -m "crypto forecast manifest"
          git pull --rebase --autostash
          git push
      - name: A lejárt kripto-becslések és -tézisek kiértékelése
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m pipeline.crypto.resolve
      - name: Kripto megjelenítési fájlok (külön a részvényesektől)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m pipeline.crypto.publish
