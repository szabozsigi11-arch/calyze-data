# Az indikátor-aréna teljes historikus mérése (spec/11, Fázis 2).
#
# Nem a tulajdonos gépén fut: 620 papír húsz éve nem fér el kényelmesen 8 GB
# memóriában. A napló nyilvános, ezért csak darabszám és összefoglaló kerül
# bele — mért találati arány nem, az a belépés mögé megy.
name: Arena

on:
  schedule:
    # Vasárnap 10:00 UTC: a heti tanítás (08:00) után, hogy ne fussanak egyszerre.
    - cron: "0 10 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = számol, de nem ír"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arena
  cancel-in-progress: false

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --frozen --no-dev
      - name: A teljes aréna-mérés
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run python -m pipeline.arena.run $DRY_RUN

  # A minta-aréna (spec/03 3.3): támasz-ellenállás, gyertyaminták,
  # váll-fej-váll. Független az indikátor-arénától, ezért mellette fut.
  patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --frozen --no-dev
      - name: A teljes minta-mérés
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run python -m pipeline.patterns.run $DRY_RUN

  # A konfluencia-motor (docs/konfluencia.md): kiváltó × kontextus-kombinációk,
  # felfedezés 2018 végéig, megerősítés 2019-től. A naplóba csak darabszám kerül.
  confluence:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --frozen --no-dev
      - name: A teljes konfluencia-mérés
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run python -m pipeline.confluence.run $DRY_RUN

  # A hír-aréna (docs/hir-arena.md): a sokk- és naptári jelzések pontossága a
  # realizált volatilitáson. Élő 2026-09-26-tól, előtte backtest, külön.
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --frozen --no-dev
      - name: A hír-aréna mérése
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run python -m pipeline.newsarena.run $DRY_RUN
  crypto:
    # A kripto-arénák (docs/kripto-arenak.md): saját korrekciós családban, a
    # crypto/ megjelenítési mappába. A részvényes jobokkal nem függ össze.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --frozen --no-dev
      - name: Kripto indikátor-, minta- és hír-aréna
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m pipeline.crypto.arenas
