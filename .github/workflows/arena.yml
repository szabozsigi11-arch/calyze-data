# Az indikátor-aréna teljes historikus mérése (spec/11, Fázis 2).
#
# Nem a tulajdonos gépén fut: 620 papír húsz éve nem fér el kényelmesen 8 GB
# memóriában. A napló nyilvános, ezért csak darabszám és összefoglaló kerül
# bele — mért találati arány nem, az a belépés mögé megy.
name: Arena

on:
  schedule:
    # Vasárnap 10:00 UTC: a heti tanítás (08:00) után, hogy ne fussanak egyszerre.
    - cron: "0 10 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = számol, de nem ír"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arena
  cancel-in-progress: false

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --no-dev
      - name: A teljes aréna-mérés
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run python -m pipeline.arena.run $DRY_RUN

  # A minta-aréna (spec/03 3.3): támasz-ellenállás, gyertyaminták,
  # váll-fej-váll. Független az indikátor-arénától, ezért mellette fut.
  patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --no-dev
      - name: A teljes minta-mérés
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run python -m pipeline.patterns.run $DRY_RUN
