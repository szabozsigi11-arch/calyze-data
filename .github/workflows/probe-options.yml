# IDEIGLENES: az opciós lánc elérhetősége az Actions gépről (N9 előtti próba).
# A naplóba csak darabszám kerül, ár és volatilitás nem. Utána törlődik.
name: Probe options
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --frozen --no-dev
      - name: Opciós lánc — csak darabszámok
        run: |
          uv run python - <<'PY'
          import time, yfinance as yf
          ok = fail = 0
          t0 = time.time()
          for sym in ["AAPL","MSFT","SPY","QQQ","KO","JNJ","XOM","NVDA","IWM","ZBRA"]:
              try:
                  t = yf.Ticker(sym)
                  exps = t.options
                  n = len(t.option_chain(exps[0]).calls) if exps else 0
                  print(sym, "lejaratok:", len(exps), "call sorok:", n)
                  ok += n > 0; fail += n == 0
              except Exception as e:
                  print(sym, "HIBA:", type(e).__name__); fail += 1
          print(f"sikeres: {ok}, sikertelen: {fail}, ido: {time.time()-t0:.0f} mp")
          PY
